<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#424242" stroke-width="2.4" stroke-linecap="round">
  <!--
    The editor tab's icon, for light themes. The same two strands as `weft.svg`, drawn in ink
    rather than in `currentColor`: a tab icon is rendered as an image and not as a CSS mask, so
    nothing gives `currentColor` a colour to be and it would resolve to black on every theme.
    Hence two files - see `tab-dark.svg` - and hence a grey chosen to sit beside a tab label
    rather than the pure black that would shout next to one.
  -->
  <path d="M6.5 3c0 3.5 11 4.5 11 9s-11 5.5-11 9"/>
  <path d="M17.5 3c0 3.5-11 4.5-11 9s11 5.5 11 9"/>
</svg>
